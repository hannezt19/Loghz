name: Build Capacitor APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Ambil kode dari repo
        uses: actions/checkout@v4

      - name: Siapkan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Siapkan Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Buat identitas proyek (package.json)
        run: npm init -y

      - name: Izinkan konflik peer-dependency npm (perlu untuk plugin Google Auth)
        run: echo "legacy-peer-deps=true" > .npmrc

      - name: Pasang Capacitor
        run: npm install @capacitor/core@latest-7 @capacitor/cli@latest-7 @capacitor/android@latest-7 @capacitor/filesystem@latest-7 @capacitor/share@latest-7 @capacitor/app@latest-7 @capacitor-community/sqlite@^7.0.0

      - name: Pasang plugin Google Sign-In (untuk fitur Cloud/Google Drive)
        run: npm install @codetrix-studio/capacitor-google-auth
      - name: Siapkan library Excel (SheetJS)
        run: |
          npm install xlsx --no-save
          mkdir -p vendor
          cp node_modules/xlsx/dist/xlsx.full.min.js vendor/xlsx.full.min.js
      - name: Siapkan library PDF (jsPDF)
        run: |
          npm install jspdf --no-save
          mkdir -p vendor
          cp node_modules/jspdf/dist/jspdf.umd.min.js vendor/jspdf.umd.min.js
      - name: Siapkan library tabel PDF (jsPDF-AutoTable)
        run: |
          npm install jspdf-autotable --no-save
          mkdir -p vendor
          cp node_modules/jspdf-autotable/dist/jspdf.plugin.autotable.min.js vendor/jspdf.plugin.autotable.min.js
      - name: Siapkan library SQLite (untuk penyimpanan offline)
        run: |
          mkdir -p vendor
          cp node_modules/@capacitor/core/dist/capacitor.js vendor/capacitor-core.js
          cp node_modules/@capacitor-community/sqlite/dist/plugin.js vendor/capacitor-community-sqlite.js
      - name: Susun folder www/ dari file web
        run: |
          mkdir -p www
          cp index.html www/
          cp db.js www/ || true
          cp manifest.json www/ || true
          cp service-worker.js www/ || true
          cp -r icons www/ || true
          cp -r fonts www/ || true
          cp -r vendor www/ || true
          cp -r css www/ || true
          cp -r js www/ || true
      - name: Init Capacitor project
        run: npx cap init "Log Hz" "com.hz.loghz" --web-dir=www

      - name: Tambah platform Android
        run: npx cap add android

      - name: Ganti ikon aplikasi
        run: |
          for d in mdpi hdpi xhdpi xxhdpi xxxhdpi; do
            cp ic_launcher.png android/app/src/main/res/mipmap-$d/ic_launcher.png
            cp ic_launcher_round.png android/app/src/main/res/mipmap-$d/ic_launcher_round.png
            cp ic_launcher_foreground.png android/app/src/main/res/mipmap-$d/ic_launcher_foreground.png
          done
          mkdir -p android/app/src/main/res/values
          cat > android/app/src/main/res/values/ic_launcher_background.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <resources>
              <color name="ic_launcher_background">#FFFFFF</color>
          </resources>
          EOF
          mkdir -p android/app/src/main/res/mipmap-anydpi-v26
          cat > android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml << 'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <adaptive-icon xmlns:android="http://schemas.android.com/apk/res/android">
              <background android:drawable="@color/ic_launcher_background"/>
              <foreground android:drawable="@mipmap/ic_launcher_foreground"/>
          </adaptive-icon>
          EOF
          cp android/app/src/main/res/mipmap-anydpi-v26/ic_launcher.xml android/app/src/main/res/mipmap-anydpi-v26/ic_launcher_round.xml
      - name: Sync web assets
        run: npx cap sync android

      - name: Sinkronkan nomor versi dari index.html
        run: |
          VERSION=$(grep -oP 'Versi \K[0-9]+\.[0-9]+\.[0-9]+' index.html | head -1)
          if [ -z "$VERSION" ]; then
            echo "Tidak ketemu 'Versi x.x.x' di index.html, pakai default 1.0.0"
            VERSION="1.0.0"
          fi
          echo "Versi terdeteksi dari index.html: $VERSION"
          echo "Nomor build (versionCode) dari GitHub Actions: ${{ github.run_number }}"
          sed -i "s/versionName \"[^\"]*\"/versionName \"$VERSION\"/" android/app/build.gradle
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          grep "versionName\|versionCode" android/app/build.gradle
      - name: Tambah izin akses internal storage
        run: |
          MANIFEST="android/app/src/main/AndroidManifest.xml"
          if ! grep -q "WRITE_EXTERNAL_STORAGE" "$MANIFEST"; then
            sed -i 's#<manifest xmlns:android="http://schemas.android.com/apk/res/android">#<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" />\n    <uses-permission android:name="android.permission.WRITE_EXTERNAL_STORAGE" />#' "$MANIFEST"
          fi
          sed -i 's#<application#<application android:requestLegacyExternalStorage="true"#' "$MANIFEST"
      - name: Perbaiki konflik versi Kotlin
        run: |
          cat >> android/build.gradle << 'EOF'
          allprojects {
              configurations.all {
                  resolutionStrategy {
                      force "org.jetbrains.kotlin:kotlin-stdlib:1.9.24"
                      force "org.jetbrains.kotlin:kotlin-stdlib-common:1.9.24"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.9.24"
                      force "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.9.24"
                  }
              }
          }
          EOF
      - name: Siapkan keystore penandatanganan
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore
      - name: Tambah konfigurasi signing ke Gradle
        run: |
          cat >> android/app/build.gradle << 'EOF'
          android {
              signingConfigs {
                  release {
                      storeFile file("release.keystore")
                      storePassword System.getenv("KEYSTORE_PASSWORD")
                      keyAlias System.getenv("KEY_ALIAS")
                      keyPassword System.getenv("KEY_PASSWORD")
                  }
              }
              buildTypes {
                  release {
                      signingConfig signingConfigs.release
                  }
              }
          }
          EOF
      - name: Build APK (release, signed)
        uses: nick-fields/retry@v3
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        with:
          timeout_minutes: 10
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: log-hz-apk
          path: android/app/build/outputs/apk/release/app-release.apk
