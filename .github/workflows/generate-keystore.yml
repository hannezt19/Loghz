name: Generate Keystore (sekali jalan)

on:
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Siapkan Java (JDK 21)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Buat password & alias acak
        run: |
          echo "STORE_PW=$(openssl rand -base64 18)" >> $GITHUB_ENV
          echo "KEY_PW=$(openssl rand -base64 18)" >> $GITHUB_ENV
          echo "ALIAS=log_hz_key" >> $GITHUB_ENV

      - name: Generate keystore
        run: |
          keytool -genkeypair -v \
            -keystore log-hz-release.keystore \
            -alias "$ALIAS" \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass "$STORE_PW" -keypass "$KEY_PW" \
            -dname "CN=Log Hz, OU=Trial, O=HZ, L=Unknown, S=Unknown, C=ID"

      - name: Susun file hasil (base64 + kredensial)
        run: |
          {
            echo "=== SIMPAN INI BAIK-BAIK, LALU HAPUS ARTIFACT INI SETELAH DISALIN ==="
            echo ""
            echo "KEYSTORE_PASSWORD:"
            echo "$STORE_PW"
            echo ""
            echo "KEY_ALIAS:"
            echo "$ALIAS"
            echo ""
            echo "KEY_PASSWORD:"
            echo "$KEY_PW"
            echo ""
            echo "KEYSTORE_BASE64:"
            base64 -w0 log-hz-release.keystore
            echo ""
          } > keystore-credentials.txt

      - name: Upload hasil (file .keystore asli + teks kredensial)
        uses: actions/upload-artifact@v4
        with:
          name: log-hz-keystore-CREDENTIALS-HAPUS-SETELAH-DIPAKAI
          path: |
            keystore-credentials.txt
            log-hz-release.keystore
          retention-days: 1
